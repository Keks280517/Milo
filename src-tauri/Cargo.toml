[package]
name = "milo"
version = "0.5.0"
description = "Milo - persoenlicher Desktop-KI-Assistent"
authors = ["Keks280517"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "milo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["process", "time", "sync", "macros", "rt-multi-thread"] }
futures-util = "0.3.34"
chrono = "0.4.45"
anyhow = "1.0.104"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-log = "2.10.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Media_Control", "Foundation", "Storage_Streams", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Power", "Win32_Media_Audio_Endpoints", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_Globalization", "Win32_System_Registry"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "gzip", "query", "charset"] }
scraper = "0.27.0"
url = "2.5.8"
pdf-extract = "0.12.1"
base64 = "0.22.1"
png = "0.18.1"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
sherpa-onnx = "1.13.8"
cpal = "0.18.2"
tauri-plugin-global-shortcut = "2"
chrono-tz = "0.10.4"
sysinfo = "0.39.6"
windows-core = "0.62.2"
ego-tree = "0.11.0"
docx-rs = { version = "0.4.22", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
